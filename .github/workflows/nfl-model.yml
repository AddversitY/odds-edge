# Refits the Coach's Line from free nflverse files and checks the app.
# The trainer does not call The Odds API and does not use a key.
name: Coach's Line

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Tuesday 14:00 UTC, after the Monday game, during the season and out of it.
    - cron: "0 14 * * 2"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: Train and backtest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model packages
        run: pip install -r model/requirements.txt

      - name: Test the rating math and the walk-forward split
        run: python -m unittest discover -s model -t model

      - name: Train from a clean checkout
        run: python model/train.py

      - name: Refresh player box scores from nflverse
        if: github.event_name != 'pull_request'
        run: python tools/import_player_stats.py

      - name: Validate the prior-season parlay dependence model
        run: python model/parlay_simulation.py

      - name: Commit a refreshed model and player file
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "odds-edge-model"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nfl-model.json assets/nfl-player-stats.json assets/parlay-calibration.json
          if git diff --cached --quiet; then
            echo "Model and player files unchanged."
          else
            git commit -m "Refresh Coach's Line and player box scores from nflverse."
            git push
          fi

  app:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Install Dart packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web
